services :
    # ─────────────────────── Kafka ────────────────────────
    kafka             :
        image          : apache/kafka:3.9.2
        container_name : kafka
        environment    :
            KAFKA_NODE_ID                                  : 1
            KAFKA_PROCESS_ROLES                            : broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS                 : 1@kafka:9093
            
            # Two listeners — one for inside Docker, one for outside
            KAFKA_LISTENERS                                : PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
            
            # Internal = kafka:9092 for containers
            # External = localhost:9094 for IntelliJ/tools outside Docker
            KAFKA_ADVERTISED_LISTENERS                     : PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
            
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP           : PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES                : CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME               : PLAINTEXT
            KAFKA_AUTO_CREATE_TOPICS_ENABLE                : "true"
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR         : 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR : 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR            : 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS         : 0
        ports          :
            - "9092:9092"
            - "9094:9094"   # ← expose external port
        networks       :
            - blog-net
        healthcheck    :
            test         : [ "CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092" ]
            interval     : 10s
            timeout      : 10s
            retries      : 5
            start_period : 30s
    
    # ─────────────────── Elasticsearch ────────────────────
    elasticsearch     :
        image          : elasticsearch:8.13.4
        container_name : elasticsearch
        environment    :
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
        ports          :
            - "9200:9200"
            - "9300:9300"
        networks       :
            - blog-net
        volumes        :
            - es-data:/usr/share/elasticsearch/data
        healthcheck    :
            test         : [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
            interval     : 10s
            timeout      : 5s
            retries      : 10
            start_period : 30s
    
    # ─────────────────── Redis - Cache ────────────────────
    redis             :
        image    : redis:7-alpine
        ports    :
            - "16379:6379"
        networks :
            - blog-net
        volumes  :
            - redis-post-data:/data
        restart  : always
    
    # ─────────────────── Post Database ────────────────────
    post-db           :
        image          : postgres:17-alpine
        container_name : post-db
        volumes        :
            - post-db:/var/lib/postgresql/data
        ports          :
            - "5001:5432"
        networks       :
            - blog-net
        environment    :
            POSTGRES_DB       : ${POST_DB}
            POSTGRES_USER     : ${POSTGRES_USER}
            POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
        healthcheck    :
            test     : [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POST_DB}" ]
            interval : 5s
            timeout  : 5s
            retries  : 5
    
    # ────────────────── Comment Database ──────────────────
    comment-db        :
        image          : postgres:17-alpine
        container_name : comment-db
        volumes        :
            - comment-db:/var/lib/postgresql/data
        ports          :
            - "5002:5432"
        networks       :
            - blog-net
        environment    :
            POSTGRES_DB       : ${COMMENT_DB}
            POSTGRES_USER     : ${POSTGRES_USER}
            POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
        healthcheck    :
            test     : [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${COMMENT_DB}" ]
            interval : 5s
            timeout  : 5s
            retries  : 5
    
    # ────────────────── Analytics Database ──────────────────
    analytics-db      :
        image          : postgres:17-alpine
        container_name : analytics-db
        volumes        :
            - analytics-db:/var/lib/postgresql/data
        ports          :
            - "5003:5432"
        networks       :
            - blog-net
        environment    :
            POSTGRES_DB       : ${ANALYTICS_DB}
            POSTGRES_USER     : ${POSTGRES_USER}
            POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
        healthcheck    :
            test     : [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ANALYTICS_DB}" ]
            interval : 5s
            timeout  : 5s
            retries  : 5
    
    # ──────────────────── Post Service ────────────────────
    post-service      :
        build          :
            context    : ./post-service
            dockerfile : Dockerfile
        container_name : post-service
        ports          :
            - "4000:4000"
        networks       :
            - blog-net
        depends_on     :
            post-db       :
                condition : service_healthy
            elasticsearch :
                condition : service_healthy
        environment    :
            SPRING_DATASOURCE_URL          : jdbc:postgresql://post-db:5432/post_db
            SPRING_DATASOURCE_USERNAME     : ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD     : ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS : kafka:9092
            SPRING_DATA_REDIS_HOST         : redis
            SPRING_DATA_REDIS_PORT         : 6379
    
    # ────────────────── Comment Service ───────────────────
    comment-service   :
        build          :
            context    : ./comment-service
            dockerfile : Dockerfile
        container_name : comment-service
        ports          :
            - "4001:4001"
        networks       :
            - blog-net
        depends_on     :
            comment-db :
                condition : service_healthy
        environment    :
            SPRING_DATASOURCE_URL          : jdbc:postgresql://comment-db:5432/comment_db
            SPRING_DATASOURCE_USERNAME     : ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD     : ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS : kafka:9092
            SPRING_DATA_REDIS_HOST         : redis
            SPRING_DATA_REDIS_PORT         : 6379
    
    # ────────────────── Analytics Service ───────────────────
    analytics-service :
        build          :
            context    : ./analytics-service
            dockerfile : Dockerfile
        container_name : analytics-service
        ports          :
            - "4003:4003"
        networks       :
            - blog-net
        depends_on     :
            analytics-db :
                condition : service_healthy
        environment    :
            SPRING_DATASOURCE_URL          : jdbc:postgresql://analytics-db:5432/analytics_db
            SPRING_DATASOURCE_USERNAME     : ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD     : ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS : kafka:9092

# ───────────────────────── Others ─────────────────────────
volumes  :
    post-db         :
    comment-db      :
    analytics-db    :
    redis-post-data :
    es-data         :

networks :
    blog-net :
        driver : bridge
