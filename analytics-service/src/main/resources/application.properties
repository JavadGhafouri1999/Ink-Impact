# Server Configs
spring.application.name                  = analytics-service
spring.main.banner-mode                  = off
server.port                              = 4003
logging.pattern.console                  = %d{HH:mm:ss} [%X{requestId}] %-5level %logger{0} - %msg%n
logging.level.com.weblog.postservice     = DEBUG
logging.level.org.springframework.web    = INFO
logging.level.org.hibernate              = WARN
spring.output.ansi.enabled               = always

# Main Database
spring.datasource.url                    = ${SPRING_DATASOURCE_URL}
spring.datasource.username               = ${POSTGRES_USER}
spring.datasource.password               = ${POSTGRES_PASSWORD}
spring.datasource.driver-class-name      = org.postgresql.Driver

# Hibernate - Validate schema against Flyway migrations
#spring.sql.init.mode                     = always
#spring.sql.init.schema-locations         = classpath:schema.sql
spring.jpa.hibernate.ddl-auto            = update
spring.jpa.open-in-view                  = false

# Kafka Consumer
spring.kafka.consumer.group-id           = analytics-service
spring.kafka.consumer.key-deserializer   = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.auto-offset-reset  = earliest
spring.kafka.bootstrap-servers           = ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
