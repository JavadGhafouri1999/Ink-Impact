spring    :
  application   :
    name : post-service
  main          :
    banner-mode : off
  output        :
    ansi :
      enabled : always
  
  # Main Database
  jpa           :
    hibernate    :
      ddl-auto : validate
    open-in-view : false
  
  flyway        :
    enabled             : true
    baseline-on-migrate : true
    validate-on-migrate : true
  
  datasource    :
    url               : ${SPRING_DATASOURCE_URL}
    username          : ${POSTGRES_USER}
    password          : ${POSTGRES_PASSWORD}
    driver-class-name : org.postgresql.Driver
  
  # Redis
  data          :
    redis :
      host : redis
      port : 6379
  
  # Kafka
  kafka         :
    producer :
      key-serializer   : org.apache.kafka.common.serialization.StringSerializer
      value-serializer : org.apache.kafka.common.serialization.ByteArraySerializer
  
  # Elasticsearch
  elasticsearch :
    username           :
    password           :
    uris               : http://elasticsearch:9200
    connection-timeout : 5s
    socket-timeout     : 30s
  
  # Multipart upload config
  servlet       :
    multipart :
      max-file-size    : 5MB
      max-request-size : 20MB

server    :
  port : 4000

app       :
  storage :
    post-images-dir : /app/uploads/posts
    max-file-size   : 5242880  # 5MB

logging   :
  pattern :
    console : "%d{HH:mm:ss} [%X{requestId}] %-5level %logger{0} - %msg%n"
  level   :
    com.weblog.postservice  : DEBUG
    org.springframework.web : INFO
    org.hibernate           : WARN

springdoc :
  api-docs   :
    path : /api-docs
  swagger-ui :
    path : /swagger-ui.html
