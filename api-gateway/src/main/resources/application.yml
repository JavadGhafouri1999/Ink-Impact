server  :
  port : 4004

spring  :
  application :
    name : api-gateway
  
  main        :
    banner-mode : off
  
  cloud       :
    compatibility-verifier :
      enabled : false
    
    gateway                :
      routes :
        # ===================== AUTH SERVICE =====================
        - id         : auth-service-route
          uri        : http://auth-service:4005
          predicates :
            - Path=/api/auth/**
          filters    :
            - StripPrefix=0
        
        # ===================== POST SERVICE =====================
        - id         : post-service-route
          uri        : http://post-service:4000
          predicates :
            - Path=/api/posts/**
          filters    :
            - StripPrefix=0
        
        - id         : api-docs-post-route
          uri        : http://post-service:4000
          predicates :
            - Path=/api-docs/posts
          filters    :
            - StripPrefix=0
        
        # ===================== COMMENT SERVICE =====================
        - id         : comment-service-route
          uri        : http://comment-service:4001
          predicates :
            - Path=/api/comments/**
          filters    :
            - StripPrefix=0
        
        # ==================== ANALYTICS SERVICE ====================
        - id         : analytics-service-route
          uri        : http://analytics-service:4002
          predicates :
            - Path=/api/analytics/**
          filters    :
            - StripPrefix=0
  
  # ========================== Kafka ==========================
  kafka       :
    bootstrap-servers : kafka:9092
    producer          :
      key-serializer   : org.apache.kafka.common.serialization.StringSerializer
      value-serializer : org.springframework.kafka.support.serializer.JsonSerializer
      properties       :
        spring.json.add.type.headers : false
    admin             :
      auto-create : true

jwt     :
  secret : ${JWT_SECRET}

logging :
  level :
    org.springframework.security : INFO
    com.yourapp.gateway          : DEBUG
