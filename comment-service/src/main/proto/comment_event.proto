syntax = "proto3";

option java_package = "com.weblog.commentservice.event";

option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

message CommentEvent{
	string id = 1;
	string postId = 2;
	string content = 3;
	string userId = 4;
	google.protobuf.Timestamp createdAt = 5;
}
